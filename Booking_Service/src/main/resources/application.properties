spring.application.name=booking-service
server.port=8081
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# ===== Database =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hotel_booking}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ===== SQL Init =====
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

# ===== Mail =====
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
booking.mail.from=${BOOKING_MAIL_FROM:no-reply@booking.local}

# ===== Payment callback / redirect =====
payment.mode=mock
payment.callback-url=http://localhost:8081/api/payments/callback
payment.return-url=http://localhost:3000/payment-result

# ===== MoMo sandbox =====
payment.momo.mode=mock
payment.momo.partner-code=MOMO
payment.momo.access-key=${MOMO_ACCESS_KEY}
payment.momo.secret-key=${MOMO_SECRET_KEY}
payment.momo.create-url=https://test-payment.momo.vn/v2/gateway/api/create

# ===== VNPay sandbox =====
payment.vnpay.mode=mock
payment.vnpay.tmn-code=${VNPAY_TMN_CODE}
payment.vnpay.secret-key=${VNPAY_SECRET_KEY}
payment.vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html

# ===== Pricing =====
pricing.commission-rate=0.30

# Organic ranking weights
ranking.weights.trust=0.4
ranking.weights.popularity=0.2
ranking.weights.distance=0.2
ranking.weights.price-match=0.2

# Renter service internal API
renter.service.base-url=http://localhost:8082
notification.service.base-url=http://localhost:3004

# Must match the auth service secret so Booking_Service can validate access tokens.
security.jwt.secret=${JWT_SECRET}
