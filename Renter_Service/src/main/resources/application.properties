spring.application.name=renter-service
server.port=8082
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# ===== Database =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hotel_booking}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ===== SQL Init =====
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

# RabbitMQ (override in env)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Organic ranking weights
ranking.weights.trust=0.4
ranking.weights.popularity=0.2
ranking.weights.distance=0.2
ranking.weights.price-match=0.2

# Redis budget cache
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Scheduling
spring.task.scheduling.time-zone=Asia/Ho_Chi_Minh

# Internal services
notification.service.base-url=http://localhost:3004
